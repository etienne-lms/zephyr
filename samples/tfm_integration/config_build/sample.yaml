sample:
  description: Test TF-M builds in various configurations
  name: TF-M build configuration
common:
  tags:
    - trusted-firmware-m
  platform_allow:
    - v2m_musca_s1/musca_s1/ns
    - nrf5340dk/nrf5340/cpuapp/ns
    - nrf9160dk/nrf9160/ns
    - nrf54l15dk/nrf54l15/cpuapp/ns
    - nrf54l15dk/nrf54l10/cpuapp/ns
    - nrf54lm20dk/nrf54lm20a/cpuapp/ns
    - nrf54lm20dk/nrf54lm20b/cpuapp/ns
    - nrf7120dk/nrf7120/cpuapp/ns
    - bl5340_dvk/nrf5340/cpuapp/ns
    - b_u585i_iot02a/stm32u585xx/ns
    - nucleo_l552ze_q/stm32l552xx/ns
    - nucleo_wba65ri/stm32wba65xx/ns
    - stm32l562e_dk/stm32l562xx/ns
    - stm32h573i_dk/stm32h573xx/ns
    - stm32wba65i_dk1/stm32wba65xx/ns
  integration_platforms:
    - nrf5340dk/nrf5340/cpuapp/ns
  harness: console
  harness_config:
    type: one_line
    regex:
      - "Hello World! (.*)"
tests:
  sample.config_build.no_bl2:
    extra_configs:
      - CONFIG_TFM_BL2=n
